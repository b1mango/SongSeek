<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#ebe2d1"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#2e2924"/>
      <stop offset="0.6" stop-color="#1b1815"/>
      <stop offset="1" stop-color="#0f0d0b"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="label" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e2603f"/>
      <stop offset="1" stop-color="#b43c22"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#b9b0a2"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a2a18" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="discClip"><circle cx="472" cy="540" r="300"/></clipPath>
  </defs>

  <!-- squircle tile (macOS grid: 824 content, 100 inset) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#000" stroke-opacity="0.06"/>

  <!-- record -->
  <g filter="url(#drop)">
    <circle cx="472" cy="540" r="300" fill="url(#disc)"/>
  </g>
  <g clip-path="url(#discClip)" fill="none" stroke="#ffffff">
    <circle cx="472" cy="540" r="284" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="472" cy="540" r="262" stroke-opacity="0.05" stroke-width="2"/>
    <circle cx="472" cy="540" r="240" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="472" cy="540" r="218" stroke-opacity="0.05" stroke-width="2"/>
    <circle cx="472" cy="540" r="196" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="472" cy="540" r="174" stroke-opacity="0.05" stroke-width="2"/>
    <circle cx="472" cy="540" r="152" stroke-opacity="0.06" stroke-width="2"/>
    <rect x="152" y="220" width="640" height="640" fill="url(#sheen)" stroke="none"/>
  </g>
  <circle cx="472" cy="540" r="120" fill="url(#label)"/>
  <circle cx="472" cy="540" r="120" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="472" cy="540" r="84" fill="none" stroke="#fff4ec" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="472" cy="540" r="16" fill="#f5f1e8"/>

  <!-- tonearm -->
  <g filter="url(#soft)">
    <circle cx="770" cy="262" r="46" fill="url(#arm)"/>
    <circle cx="770" cy="262" r="18" fill="#2a2520"/>
    <path d="M770 262 L742 520 L650 640" fill="none" stroke="url(#arm)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="610" y="622" width="66" height="44" rx="10" transform="rotate(-38 643 644)" fill="#2a2520"/>
  </g>
</svg>
